name: ROS checks

on: [push, pull_request]

env:
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w11-0b67bfd41448.tar.gz
  COURSE_KIT_SHA256: 0b67bfd41448549d21122124b7f49211ba2cd068cc56751871f319eadeb9d0ab

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full@sha256:d16957210572c5f919f3f9bd2fb0cc24a82542647489d8b8eda7c3beda31305f

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ROS dependencies
        shell: bash
        run: |
          apt-get update
          apt-get upgrade -y --with-new-pkgs
          apt-get install -y --no-install-recommends \
            ros-jazzy-xacro ros-jazzy-robot-state-publisher \
            ros-jazzy-ament-cmake-pytest ros-jazzy-ackermann-msgs \
            ros-jazzy-ros-gz ros-jazzy-rosbag2-storage-mcap \
            ros-jazzy-nav2-amcl ros-jazzy-nav2-map-server \
            ros-jazzy-nav2-lifecycle-manager ros-jazzy-tf2-ros-py ros-jazzy-tf2-tools \
            ros-jazzy-vision-msgs ros-jazzy-diagnostic-msgs python3-jsonschema \
            liburdfdom-tools python3-pytest

      - name: Download course kit
        shell: bash
        run: |
          curl -fsSLo /tmp/course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" /tmp/course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf /tmp/course-kit.tar.gz -C .course-kit

      - name: Build packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select \
            turtle_bringup patrol course_bringup course_description course_simulation localization_case perception_baseline robotics_course_interfaces scene_adapter

      - name: Check URDF
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          xacro src/course_description/urdf/vehicle.urdf.xacro > /tmp/vehicle.urdf
          check_urdf /tmp/vehicle.urdf

      - name: Test packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select \
            turtle_bringup patrol course_bringup course_description course_simulation localization_case perception_baseline robotics_course_interfaces scene_adapter \
            --event-handlers console_direct+
          colcon test-result --verbose

      - name: Validate PR08 localization metrics
        shell: bash
        run: |
          python3 .course-kit/v1/tools/validate_localization.py \
            evidence/pr08/localization.json \
            --schema .course-kit/v1/fixtures/pr08/localization-result-v1.schema.json \
            --map-yaml evidence/pr08/map.yaml --map-pgm evidence/pr08/map.pgm

      - name: Recompute PR09 metrics
        shell: bash
        run: |
          python3 .course-kit/v1/tools/evaluate_perception.py \
            --fixture .course-kit/v1/fixtures/pr09 \
            --manifest data/manifest.json --output /tmp/pr09-metrics.json
          if [ -f evidence/pr09/metrics.json ]; then
            python3 -c 'import json, sys; sys.exit(json.load(open("/tmp/pr09-metrics.json")) != json.load(open("evidence/pr09/metrics.json")))'
          fi

      - name: Check PR10 evidence
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          submission="$(git log -1 --format=%H -- evidence/pr10/report.json)"
          snapshot="$(mktemp -d)"
          git config --global --add safe.directory "$snapshot"
          git worktree add --detach "$snapshot" "$submission"
          trap 'git worktree remove "$snapshot"' EXIT
          python3 .course-kit/v1/tools/check_practice.py PR10 --submission "$snapshot"

  rl:
    runs-on: ubuntu-latest
    env:
      COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w12-525e86f818ff.tar.gz
      COURSE_KIT_SHA256: 525e86f818ffed166e7f7b67cc87fdd3f3ea840d13aa90e76bde9fda0f3c9c5a

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download RL course kit
        shell: bash
        run: |
          curl -fsSLo "$RUNNER_TEMP/course-kit.tar.gz" "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" "$RUNNER_TEMP/course-kit.tar.gz" | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf "$RUNNER_TEMP/course-kit.tar.gz" -C .course-kit

      - name: Test and evaluate PR11
        shell: bash
        run: |
          export PYTHONPATH=.course-kit/v1/rl_intro
          python3 -B -m unittest discover -s labs/pr11/tests -v
          python3 -B labs/pr11/train.py --output "$RUNNER_TEMP/pr11-q-table.json"
          python3 -B .course-kit/v1/rl_intro/evaluate.py \
            --policy "$RUNNER_TEMP/pr11-q-table.json" --output "$RUNNER_TEMP/pr11-evaluation.json"

      - name: Check PR12 run script
        shell: bash
        run: bash -n labs/pr12/run.sh

      - name: Check RL evidence at submission commits
        shell: bash
        run: |
          for number in 11 12; do
            report="evidence/pr$number/report.json"
            if [[ -f "$report" ]]; then
              submission="$(git log -1 --format=%H -- "$report")"
              snapshot="$(mktemp -d)"
              git worktree add --detach "$snapshot" "$submission"
              trap 'git worktree remove "$snapshot"' EXIT
              python3 .course-kit/v1/tools/check_practice.py "PR$number" --submission "$snapshot"
              git worktree remove "$snapshot"
              trap - EXIT
            fi
          done
