name: ROS checks

on: [push, pull_request]

env:
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w05-bca214e3de6f.tar.gz
  COURSE_KIT_SHA256: bca214e3de6f90f9513049dfa0f36fee65ad834da502dc3f3f8fb443517b5197

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full@sha256:d16957210572c5f919f3f9bd2fb0cc24a82542647489d8b8eda7c3beda31305f

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download course kit
        shell: bash
        run: |
          curl -fsSLo /tmp/course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" /tmp/course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf /tmp/course-kit.tar.gz -C .course-kit

      - name: Build PR05 packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select turtle_bringup patrol course_bringup

      - name: Test PR05 packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select turtle_bringup patrol course_bringup --event-handlers console_direct+
          colcon test-result --verbose

      - name: Check PR05 evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR05 --submission .
