name: ROS checks

on: [push, pull_request]

env:
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w07-9b7fdd5424d3.tar.gz
  COURSE_KIT_SHA256: 9b7fdd5424d3d97e47d51dbe23064934585e62135dc2902844dd679529bda929

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full@sha256:d16957210572c5f919f3f9bd2fb0cc24a82542647489d8b8eda7c3beda31305f

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PR07 dependencies
        shell: bash
        run: |
          apt-get update
          apt-get upgrade -y --with-new-pkgs
          apt-get install -y --no-install-recommends \
            ros-jazzy-xacro ros-jazzy-robot-state-publisher \
            ros-jazzy-ament-cmake-pytest ros-jazzy-ackermann-msgs \
            ros-jazzy-ros-gz ros-jazzy-rosbag2-storage-mcap \
            liburdfdom-tools python3-pytest

      - name: Download course kit
        shell: bash
        run: |
          curl -fsSLo /tmp/course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" /tmp/course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf /tmp/course-kit.tar.gz -C .course-kit

      - name: Build packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select \
            turtle_bringup patrol course_bringup course_description course_simulation

      - name: Check URDF
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          xacro src/course_description/urdf/vehicle.urdf.xacro > /tmp/vehicle.urdf
          check_urdf /tmp/vehicle.urdf

      - name: Test packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select \
            turtle_bringup patrol course_bringup course_description course_simulation \
            --event-handlers console_direct+
          colcon test-result --verbose

      - name: Check PR07 evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR07 --submission .
